<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S.A.M.COMPTA — Application de comptabilité</title>
<meta name="description" content="S.A.M.COMPTA — application de comptabilité multi-sociétés, hors ligne.">
<meta name="theme-color" content="#1A2E1E">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  box-sizing:border-box;
  --paper:#EEEFE2;
  --paper-deep:#E5E7D6;
  --card:#FBFBF4;
  --ink:#22301F;
  --ink-soft:#5B6B54;
  --ink-faint:#8C9884;
  --rule:#C7CBB4;
  --rule-soft:#DBDEC9;
  --green:#2F5D3A;
  --green-deep:#1F3F27;
  --green-soft:#E1E8DA;
  --red:#8C3B32;
  --red-soft:#F3E3DF;
  --gold:#9A7B2E;
  --gold-soft:#EFE6CC;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#181D16; --paper-deep:#12150F; --card:#20261C;
    --ink:#E8EAE0; --ink-soft:#B7BFAC; --ink-faint:#7C8672;
    --rule:#37402F; --rule-soft:#2A3124;
    --green:#7FB585; --green-deep:#5C9067; --green-soft:#243228;
    --red:#D08A7B; --red-soft:#33231F;
    --gold:#D7BD79; --gold-soft:#332C1A;
  }
}
:root[data-theme="dark"]{
  --paper:#181D16; --paper-deep:#12150F; --card:#20261C;
  --ink:#E8EAE0; --ink-soft:#B7BFAC; --ink-faint:#7C8672;
  --rule:#37402F; --rule-soft:#2A3124;
  --green:#7FB585; --green-deep:#5C9067; --green-soft:#243228;
  --red:#D08A7B; --red-soft:#33231F;
  --gold:#D7BD79; --gold-soft:#332C1A;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand{ font-family:Georgia, 'Times New Roman', serif; }
.num{ font-variant-numeric: tabular-nums; }
a{color:inherit;}
button{ font-family:inherit; }
::selection{ background:var(--gold-soft); }

/* ---------- shell ---------- */
#app{ min-height:100%; display:flex; }
.shell{ display:flex; width:100%; min-height:100vh; }
.sidebar{
  width:240px; flex-shrink:0; background:var(--paper-deep);
  border-right:1px solid var(--rule); display:flex; flex-direction:column;
  padding:22px 16px; gap:22px;
}
.brand{ font-size:19px; font-weight:600; color:var(--green-deep); letter-spacing:.2px; display:flex; align-items:baseline; gap:8px;}
.brand small{ font-family:ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; font-size:10px; color:var(--ink-faint); font-weight:500; }
.brand-block{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:4px 0 10px; }
.brand-logo{ width:56px; height:56px; object-fit:contain; background:#fdfdfb; border-radius:8px; padding:5px; box-shadow:0 1px 0 var(--rule); }
.brand-word{ font-family:Georgia, 'Times New Roman', serif; font-weight:700; font-size:15px; letter-spacing:.06em; color:var(--gold); line-height:1.15; }
.brand-word span{ display:block; font-size:10px; font-family:ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; font-weight:600; letter-spacing:.18em; color:var(--ink-soft); margin-top:2px; }
.company-box{ border:1px solid var(--rule); background:var(--card); padding:10px 12px; }
.company-box .lbl{ font-size:10px; color:var(--ink-faint); margin-bottom:4px; }
.company-box select{
  width:100%; border:none; background:transparent; color:var(--ink);
  font-family:ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; font-size:13px; font-weight:600; padding:2px 0; cursor:pointer;
}
.company-meta{ font-size:11px; color:var(--ink-soft); margin-top:6px; }
.btn-ghost-sm{
  margin-top:8px; width:100%; text-align:left; border:1px dashed var(--rule);
  background:transparent; color:var(--ink-soft); font-size:11px; padding:6px 8px; cursor:pointer;
}
.btn-ghost-sm:hover{ border-color:var(--green); color:var(--green-deep); }

nav.mainnav{ display:flex; flex-direction:column; gap:2px; flex:1; }
nav.mainnav .navlink{
  display:flex; align-items:center; gap:10px; padding:8px 10px; cursor:pointer;
  color:var(--ink-soft); border-left:2px solid transparent; font-size:13px;
}
nav.mainnav .navlink .n{ font-size:10px; color:var(--ink-faint); width:14px; }
nav.mainnav .navlink:hover{ color:var(--ink); background:var(--rule-soft); }
nav.mainnav .navlink.active{ color:var(--green-deep); border-left-color:var(--green); background:var(--green-soft); font-weight:600; }

.sidebar-foot{ font-size:10px; color:var(--ink-faint); border-top:1px solid var(--rule); padding-top:12px; }

main{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{
  padding:18px 28px; border-bottom:1px solid var(--rule); display:flex;
  align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.back-link{ font-size:11px; color:var(--ink-soft); cursor:pointer; margin-bottom:6px; }
.back-link:hover{ color:var(--green-deep); }
.topbar h1{ font-size:20px; margin:0; font-weight:600; }
.topbar .sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; font-family:ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;}
.content{ padding:24px 28px 60px; flex:1; overflow-x:auto; }

/* ---------- primitives ---------- */
.card{ background:var(--card); border:1px solid var(--rule); padding:18px 20px; }
.grid{ display:grid; gap:16px; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:1fr 1fr; }
@media (max-width:900px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} }

.kpi{ border-left:3px solid var(--green); padding-left:12px; }
.kpi .v{ font-size:24px; font-weight:700; font-family:Georgia, 'Times New Roman', serif; }
.kpi .l{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
.kpi.neg{ border-left-color:var(--red); }
.kpi.neg .v{ color:var(--red); }
.kpi.gold{ border-left-color:var(--gold); }

table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:left; font-weight:600; color:var(--ink-soft); font-size:11px; padding:7px 10px; border-bottom:1px solid var(--rule); white-space:nowrap;}
td{ padding:7px 10px; border-bottom:1px solid var(--rule-soft); vertical-align:middle;}
tr:hover td{ background:var(--rule-soft); }
td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
tfoot td{ border-top:2px solid var(--ink); border-bottom:none; font-weight:700; }
.table-wrap{ border:1px solid var(--rule); background:var(--card); overflow-x:auto; }
.table-wrap table{ min-width:600px; }

.tag{ display:inline-block; padding:2px 7px; font-size:10px; border:1px solid var(--rule); color:var(--ink-soft); }
.tag.d{ color:var(--red); border-color:var(--red-soft); background:var(--red-soft); }
.tag.c{ color:var(--green-deep); border-color:var(--green-soft); background:var(--green-soft); }
.tag.gold{ color:var(--gold); border-color:var(--gold-soft); background:var(--gold-soft); }

.btn{
  border:1px solid var(--ink); background:var(--ink); color:var(--paper);
  padding:8px 14px; font-size:12px; font-family:ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; font-weight:600; cursor:pointer;
}
.btn:hover{ background:var(--green-deep); border-color:var(--green-deep); }
.btn.secondary{ background:transparent; color:var(--ink); }
.btn.secondary:hover{ background:var(--rule-soft); }
.btn.danger{ background:transparent; color:var(--red); border-color:var(--red-soft); }
.btn.danger:hover{ background:var(--red-soft); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; }

label{ display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
input, select, textarea{
  width:100%; border:1px solid var(--rule); background:var(--paper);
  color:var(--ink); font-family:ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; font-size:13px; padding:8px 9px;
}
input:focus, select:focus, textarea:focus{ outline:2px solid var(--green); outline-offset:-1px; border-color:var(--green); }
.field{ margin-bottom:12px; }
.field-row{ display:flex; gap:10px; }
.field-row > div{ flex:1; }

.section-title{ font-size:12px; letter-spacing:.02em; color:var(--ink-faint); margin:26px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--rule); }
.section-title:first-child{ margin-top:0; }

.empty{ text-align:center; padding:48px 20px; color:var(--ink-soft); border:1px dashed var(--rule); background:var(--card); }
.empty h3{ font-size:16px; margin:0 0 6px; color:var(--ink); }
.empty p{ font-size:12px; margin:0 0 16px; }

.modal-bg{
  position:fixed; inset:0; background:rgba(20,25,17,.45); display:flex;
  align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto;
}
.modal{ background:var(--card); border:1px solid var(--rule); width:100%; max-width:560px; padding:22px 24px; }
.modal h2{ font-size:17px; margin:0 0 16px; }
.modal-close{ float:right; background:none; border:none; color:var(--ink-faint); font-size:18px; cursor:pointer; line-height:1; }

.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--rule); margin-bottom:16px; flex-wrap:wrap; }
.tab{ padding:8px 14px; font-size:12px; cursor:pointer; color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab.active{ color:var(--green-deep); border-bottom-color:var(--green); font-weight:600; }
.tab:hover{ color:var(--ink); }

.lines-table td{ padding:4px 6px; }
.lines-table input, .lines-table select{ padding:6px 7px; font-size:12px; }
.remove-line{ background:none; border:none; color:var(--red); cursor:pointer; font-size:15px; padding:0 6px;}
.total-row td{ font-weight:700; border-top:1px solid var(--ink); }
.balance-ok{ color:var(--green-deep); }
.balance-bad{ color:var(--red); }

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:10px 18px; font-size:12px; z-index:80;
  border:1px solid var(--ink);
}
.small{ font-size:11px; color:var(--ink-faint); }
.help{ font-size:11px; color:var(--ink-faint); margin-top:4px; }

.menu-row{
  display:flex; align-items:center; gap:18px; padding:16px 6px;
  border-bottom:1px solid var(--rule); cursor:pointer;
}
.menu-row:hover{ background:var(--green-soft); }
.menu-row:hover .menu-label{ color:var(--green-deep); }
.menu-row:hover .menu-arrow{ transform:translateX(3px); }
.menu-num{
  font-family:Georgia, 'Times New Roman', serif; font-size:20px; font-weight:600; color:var(--gold);
  width:34px; flex-shrink:0; text-align:right;
}
.menu-body{ flex:1; min-width:0; }
.menu-label{ font-family:Georgia, 'Times New Roman', serif; font-size:16px; font-weight:600; }
.menu-desc{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
.menu-arrow{ color:var(--ink-faint); font-size:16px; transition:transform .15s ease; flex-shrink:0; }
@media (max-width:600px){ .menu-desc{ display:none; } }

.onboard{ max-width:460px; margin:60px auto; }
.hairline{ height:1px; background:var(--rule); border:none; margin:18px 0; }

.print-header{ display:none; }

@media (max-width:760px){
  .shell{ flex-direction:column; }
  .sidebar{ width:100%; flex-direction:row; align-items:center; padding:12px 14px; gap:12px; overflow-x:auto; border-right:none; border-bottom:1px solid var(--rule); position:sticky; top:0; z-index:10;}
  .brand{ flex-shrink:0; }
  .company-box{ flex-shrink:0; min-width:170px; }
  nav.mainnav{ flex-direction:row; flex-shrink:0; }
  nav.mainnav .navlink{ border-left:none; border-bottom:2px solid transparent; white-space:nowrap; }
  nav.mainnav .navlink.active{ border-bottom-color:var(--green); border-left-color:transparent; }
  .sidebar-foot{ display:none; }
  .topbar, .content{ padding-left:16px; padding-right:16px; }
}

@media print{
  body{ background:#fff; color:#111; font-size:11px; }
  .sidebar, .no-print, .modal-bg, .toast, .menu-arrow, button{ display:none !important; }
  main{ width:100%; }
  .content{ padding:0; overflow:visible; }
  .print-header{ display:block; margin-bottom:18px; border-bottom:2px solid #111; padding-bottom:10px; }
  .print-brand{ font-family:Georgia, 'Times New Roman', serif; font-weight:700; font-size:16px; letter-spacing:.08em; color:#8a6d1f; }
  .print-header h2{ font-family:Georgia, 'Times New Roman', serif; font-size:18px; margin:4px 0 2px; }
  .print-date{ font-size:10px; color:#555; }
  .card, .table-wrap{ border:1px solid #999 !important; background:#fff !important; box-shadow:none !important; break-inside:avoid; }
  table{ font-size:10px; }
  th{ color:#333 !important; border-bottom:1px solid #999 !important; }
  td{ border-bottom:1px solid #ddd !important; }
  tfoot td{ border-top:2px solid #111 !important; }
  .kpi .v{ color:#111 !important; }
  .tag{ border:1px solid #999 !important; background:#f2f2f2 !important; color:#111 !important; }
  .menu-row{ border-bottom:1px solid #ccc; }
  a[href]:after{ content:''; }
}
</style>
</head>

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt = e; });
window.addEventListener('appinstalled', ()=>{ deferredPrompt = null; });
function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}

/* ============================================================
   ÉTAT & PERSISTANCE
   ============================================================ */
const state = {
  loaded:false,
  companies:[],
  currentCompanyId:null,
  accounts:[],
  journals:[],
  entries:[],
  route:'menu',
  activeJournal:null,
  activeLedgerAccount:null,
  modal:null,
};

function esc(s){
  return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:2});
}
function currentCompany(){ return state.companies.find(c=>c.id===state.currentCompanyId) || null; }
function devise(){ const c = currentCompany(); return c ? c.devise : ''; }
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

const LS_PREFIX = 'samcompta:';

function lsGet(key, fallback){
  try{
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ console.error('lecture stockage local échouée', key, e); return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); }
  catch(e){ console.error('écriture stockage local échouée', key, e); toast('Erreur de sauvegarde locale'); }
}
function lsDelete(key){
  try{ localStorage.removeItem(LS_PREFIX+key); }catch(e){ /* ignore */ }
}

async function loadAll(){
  const companiesDoc = lsGet('app:companies', {list:[]});
  state.companies = companiesDoc.list || [];
  const appState = lsGet('app:state', {});
  state.currentCompanyId = appState.currentCompanyId || (state.companies[0] ? state.companies[0].id : null);
  if(state.currentCompanyId){
    await loadCompanyData(state.currentCompanyId);
  }
  state.route = 'menu';
  state.loaded = true;
  render();
}
async function loadCompanyData(id){
  const data = lsGet('company:'+id, {accounts:[], journals:[], entries:[]});
  state.accounts = data.accounts || [];
  state.journals = data.journals || [];

  4:'Classe 4 — Comptes de tiers',

/* ============================================================
   CALCULS COMPTABLES
   ============================================================ */
function accountMovements(code){
  let debit=0, credit=0;
  for(const e of state.entries){
    for(const l of e.lines){
      if(l.compte===code){ debit += Number(l.debit)||0; credit += Number(l.credit)||0; }
    }
  }
  return {debit, credit, solde: debit-credit};
}
function computeBalanceRows(){
  return state.accounts.map(a=>{
    const m = accountMovements(a.code);
    return {...a, ...m};
  }).sort((a,b)=>a.code.localeCompare(b.code));
}
function computeResultat(){
  const rows = computeBalanceRows();
  const charges = rows.filter(r=>r.cls===6 && (r.debit||r.credit));
  const produits = rows.filter(r=>r.cls===7 && (r.debit||r.credit));
  const totalCharges = charges.reduce((s,r)=>s+(r.debit-r.credit),0);
  const totalProduits = produits.reduce((s,r)=>s+(r.credit-r.debit),0);
  return {charges, produits, totalCharges, totalProduits, resultat: totalProduits-totalCharges};
}
function computeBilan(){
  const rows = computeBalanceRows();
  const {resultat} = computeResultat();
  const actif = [];
  const passif = [];
  for(const r of rows){
    if(r.cls===2 || r.cls===3){
      if(r.debit||r.credit) actif.push({label:r.name, code:r.code, val: r.solde});
    } else if(r.cls===4){
      if(r.solde>0) actif.push({label:r.name, code:r.code, val:r.solde});
      else if(r.solde<0) passif.push({label:r.name, code:r.code, val:-r.solde});
    } else if(r.cls===5){
      if(r.solde>=0){ if(r.debit||r.credit) actif.push({label:r.name, code:r.code, val:r.solde}); }
      else passif.push({label:r.name, code:r.code, val:-r.solde});
    } else if(r.cls===1){
      if(r.debit||r.credit) passif.push({label:r.name, code:r.code, val:-r.solde});
    }
  }
  passif.push({label:"Résultat de l'exercice (calculé)", code:'', val: resultat});
  const totalActif = actif.reduce((s,x)=>s+x.val,0);
  const totalPassif = passif.reduce((s,x)=>s+x.val,0);
  return {actif, passif, totalActif, totalPassif};
}
function dashboardStats(){
  const {totalActif, totalPassif} = computeBilan();
  const {resultat, totalCharges, totalProduits} = computeResultat();
  const rows = computeBalanceRows();
  const tresorerie = rows.filter(r=>r.cls===5).reduce((s,r)=>s+r.solde,0);
  return {totalActif, totalPassif, resultat, totalCharges, totalProduits, tresorerie, nbEcritures: state.entries.length, nbComptes: state.accounts.length};
}

async function createCompany(payload){
  const id = uid();
  const company = {
    id, name: payload.name.trim(), sigle: (payload.sigle||'').trim(),
    devise: payload.devise || 'FCFA', dateDebut: payload.dateDebut || todayISO(),
    createdAt: new Date().toISOString(),
  };
  state.companies.push(company);
  await saveCompaniesList();
  state.currentCompanyId = id;
  state.accounts = defaultAccounts();
  state.journals = defaultJournals();
  state.entries = [];
  await saveCompanyData();
  await saveAppState();
  state.route = 'menu';
  toast('Société créée : '+company.name);
  render();
}
async function switchCompany(id){
  state.currentCompanyId = id;
  await loadCompanyData(id);
  await saveAppState();
  state.route = 'menu';
  render();
}
async function deleteCompany(id){
  const c = state.companies.find(co=>co.id===id);
  if(!c) return;
  state.companies = state.companies.filter(co=>co.id!==id);
  await saveCompaniesList();
  lsDelete('company:'+id);
  if(id===state.currentCompanyId){
    state.currentCompanyId = state.companies[0] ? state.companies[0].id : null;
    if(state.currentCompanyId){
      await loadCompanyData(state.currentCompanyId);
    } else {
      state.accounts = []; state.journals = []; state.entries = [];
    }
    await saveAppState();
  }
  toast('Société supprimée : '+c.name);
  render();
}
async function addAccount(payload){
  const code = payload.code.trim();
  if(!code){ toast('Le numéro de compte est requis'); return; }
  if(state.accounts.some(a=>a.code===code)){ toast('Ce numéro de compte existe déjà'); return; }
  const cls = Number(code[0]);
  state.accounts.push({code, name: payload.name.trim(), cls});
  await saveCompanyData();
  closeModal();
  render();
  toast('Compte ajouté');
}
async function deleteAccount(code){
  const used = state.entries.some(e=>e.lines.some(l=>l.compte===code));
  if(used){ toast('Impossible : ce compte est utilisé dans des écritures'); return; }
  state.accounts = state.accounts.filter(a=>a.code!==code);
  await saveCompanyData();
  render();
  toast('Compte supprimé');
}
async function addJournal(payload){
  const code = payload.code.trim().toUpperCase();
  if(!code){ toast('Le code journal est requis'); return; }
  if(state.journals.some(j=>j.code===code)){ toast('Ce code journal existe déjà'); return; }
  state.journals.push({code, name: payload.name.trim()});
  await saveCompanyData();
  state.activeJournal = code;
  closeModal();
  render();
  toast('Journal créé');
}
async function saveEntry(payload){
  state.entries.push(payload);
  await saveCompanyData();
  closeModal();
  render();
  toast('Écriture enregistrée');
}
async function deleteEntry(id){
  state.entries = state.entries.filter(e=>e.id!==id);
  await saveCompanyData();
  render();
  toast('Écriture supprimée');
}

/* ---------- Grand livre ---------- */
function renderGrandLivre(){
  const code = state.activeLedgerAccount;

  const lines = [];
  state.entries.forEach(e=>{
    e.lines.forEach(l=>{
      if(l.compte===code) lines.push({date:e.date, libelle:e.libelle, journal:e.journalCode, debit:Number(l.debit)||0, credit:Number(l.credit)||0, id:e.id});
    });
  });
  lines.sort((a,b)=> a.date.localeCompare(b.date));
  let running = 0;
  const d = devise();
  return `
  <div class="field" style="max-width:380px;">
    <label>Sélectionner un compte</label>
    <select id="ledger-account-select">
      ${state.accounts.map(a=>`<option value="${a.code}" ${a.code===code?'selected':''}>${esc(a.code)} — ${esc(a.name)}</option>`).join('')}

/* ---------- Balance générale ---------- */
function renderBalance(){
  const rows = computeBalanceRows();
  const totalD = rows.reduce((s,r)=>s+r.debit,0);
  const totalC = rows.reduce((s,r)=>s+r.credit,0);
  const d = devise();
  const eq = Math.abs(totalD-totalC) < 0.005;
  return `
  <div class="table-wrap">
    <table>
      <thead><tr><th>N°</th><th>Intitulé</th><th class="num">Total débit</th><th class="num">Total crédit</th><th class="num">Solde débiteur</th><th class="num">Solde créditeur</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td class="num">${esc(r.code)}</td><td>${esc(r.name)}</td>
          <td class="num">${r.debit? fmt(r.debit):'—'}</td><td class="num">${r.credit? fmt(r.credit):'—'}</td>
          <td class="num">${r.solde>0? fmt(r.solde):'—'}</td><td class="num">${r.solde<0? fmt(-r.solde):'—'}</td>
        </tr>`).join('')}
      </tbody>
      <tfoot><tr class="total-row">
        <td colspan="2">TOTAUX</td>
        <td class="num">${fmt(totalD)} ${d}</td><td class="num">${fmt(totalC)} ${d}</td>
        <td class="num">${fmt(rows.filter(r=>r.solde>0).reduce((s,r)=>s+r.solde,0))} ${d}</td>
        <td class="num">${fmt(rows.filter(r=>r.solde<0).reduce((s,r)=>s-r.solde,0))} ${d}</td>
      </tr></tfoot>
    </table>
  </div>
  <div style="margin-top:14px;" class="${eq?'balance-ok':'balance-bad'}">${eq? '✓ Balance équilibrée (total débit = total crédit)' : '⚠ Écart détecté entre débit et crédit'}</div>
  `;
}

/* ---------- Bilan ---------- */

function attachModalHandlers(){
  const bg = document.getElementById('modal-bg');
  if(bg) bg.addEventListener('click', e=>{ if(e.target===bg) closeModal(); });
  const cx = document.getElementById('modal-close-x'); if(cx) cx.onclick = closeModal;
  const cc = document.getElementById('modal-cancel'); if(cc) cc.onclick = closeModal;

  if(state.modal && state.modal.name==='confirm'){
    const yes = document.getElementById('confirm-yes');
    if(yes) yes.onclick = ()=>{
      const cb = state.modal.opts.onConfirm;
      state.modal = null;
      if(cb) cb();
    };
    return;
  }

  const f = document.getElementById('modal-form');
  if(!f || !state.modal) return;
  const name = state.modal.name;

  if(name==='new-company'){
    f.addEventListener('submit', e=>{
      e.preventDefault(); const fd = new FormData(f);
      createCompany({name:fd.get('name'), sigle:fd.get('sigle'), devise:fd.get('devise'), dateDebut:fd.get('dateDebut')});
    });
  } else if(name==='new-account'){
    f.addEventListener('submit', e=>{
      e.preventDefault(); const fd = new FormData(f);
      addAccount({code:fd.get('code'), name:fd.get('name')});
    });
  } else if(name==='new-journal'){
    f.addEventListener('submit', e=>{
      e.preventDefault(); const fd = new FormData(f);
      addJournal({code:fd.get('code'), name:fd.get('name')});
    });
  } else if(name==='new-entry'){
    setupEntryForm(f);
  }
}

function setupEntryForm(f){
  let lineCount = 2;
  const body = document.getElementById('lines-body');

  function recalc(){
    let td=0, tc=0;
    body.querySelectorAll('tr').forEach(row=>{
      td += Number(row.querySelector('.ln-debit').value)||0;
      tc += Number(row.querySelector('.ln-credit').value)||0;
    });
    document.getElementById('tot-debit').textContent = fmt(td);
    document.getElementById('tot-credit').textContent = fmt(tc);
    const msg = document.getElementById('balance-msg');
    const submit = document.getElementById('entry-submit');
    const balanced = td>0 && Math.abs(td-tc)<0.005;
    if(td===0 && tc===0){ msg.textContent=''; msg.className='small'; }
    else if(balanced){ msg.textContent='✓ Écriture équilibrée'; msg.className='small balance-ok'; }
    else { msg.textContent='⚠ Débit et crédit doivent être égaux'; msg.className='small balance-bad'; }
    submit.disabled = !balanced;
  }
  function bindRow(row){
    row.querySelectorAll('.ln-debit,.ln-credit').forEach(inp=>inp.addEventListener('input', recalc));
    const rm = row.querySelector('[data-remove-line]');
    rm.addEventListener('click', ()=>{ if(body.querySelectorAll('tr').length>2){ row.remove(); recalc(); } });
  }
  body.querySelectorAll('tr').forEach(bindRow);
  recalc();

  document.getElementById('add-line').addEventListener('click', ()=>{
    const acctOptions = state.accounts.map(a=>`<option value="${a.code}">${esc(a.code)} — ${esc(a.name)}</option>`).join('');
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><select class="ln-compte">${acctOptions}</select></td>
      <td><input class="ln-debit" type="number" min="0" step="0.01" placeholder="0"></td>
      <td><input class="ln-credit" type="number" min="0" step="0.01" placeholder="0"></td>
      <td><button type="button" class="remove-line" data-remove-line="${lineCount++}">×</button></td>`;
    body.appendChild(tr);
    bindRow(tr);
  });

  f.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(f);
    const lines = [];
    body.querySelectorAll('tr').forEach(row=>{
      const compte = row.querySelector('.ln-compte').value;
      const debit = Number(row.querySelector('.ln-debit').value)||0;
      const credit = Number(row.querySelector('.ln-credit').value)||0;
      if(debit>0 || credit>0) lines.push({compte, debit, credit});
    });
    const td = lines.reduce((s,l)=>s+l.debit,0), tc = lines.reduce((s,l)=>s+l.credit,0);
    if(lines.length<2 || Math.abs(td-tc)>0.005 || td===0){ toast("L'écriture doit être équilibrée (débit = crédit)"); return; }
    saveEntry({
      id: uid(), date: fd.get('date'), journalCode: fd.get('journalCode'),
      piece: fd.get('piece'), libelle: fd.get('libelle'), lines,
    });
  });
}


async function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    try{ await deferredPrompt.userChoice; }catch(e){}
    deferredPrompt = null;
    return;
  }
  const out = document.getElementById('diag-out');
  if(out) out.innerHTML = "Le navigateur n'a pas encore proposé l'installation automatique. Essayez : menu ⋮ de Chrome → « Installer l'application » ou « Ajouter à l'écran d'accueil ». Sinon appuyez sur « Vérifier l'installation ».";
  runDiagnostic();
}
async function runDiagnostic(){
  const out = document.getElementById('diag-out'); if(!out) return;
  const lines = [];
  const ok = (t)=>lines.push('✅ '+t), ko = (t)=>lines.push('❌ '+t);
  out.innerHTML = 'Vérification en cours…';
  window.isSecureContext ? ok('Connexion sécurisée (https)') : ko('Page non sécurisée : il faut ouvrir le lien https://');
  const ua = navigator.userAgent || '';
  if(/FBAN|FBAV|Instagram|WhatsApp|Line\/|Telegram|; wv\)/i.test(ua)) ko("Vous êtes dans un navigateur intégré (WhatsApp, Facebook…). Ouvrez le lien dans Chrome.");
  else if(/Android/i.test(ua) && !/Chrome\//i.test(ua)) ko("Navigateur non compatible : utilisez Chrome.");
  else ok('Navigateur compatible');
  async function check(path, label){
    try{ const r = await fetch(path, {cache:'no-store'}); r.ok ? ok(label) : ko(label+' introuvable (erreur '+r.status+')'); return r.ok; }
    catch(e){ ko(label+' inaccessible'); return false; }
  }
  await check('manifest.json', 'manifest.json présent');
  await check('icons/icon-192.png', 'icons/icon-192.png présent');
  await check('icons/icon-512.png', 'icons/icon-512.png présent');
  await check('sw.js', 'sw.js présent');
  try{
    const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    reg ? ok('Mode hors ligne (service worker) actif') : ko('Service worker non actif — rechargez la page une fois');
  }catch(e){ ko('Service worker indisponible'); }
  deferredPrompt ? ok("Chrome propose l'installation : appuyez sur « Installer l'application »") : lines.push("ℹ️ Chrome n'a pas encore proposé l'installation (utilisez le menu ⋮ → Installer l'application).");
  out.innerHTML = lines.join('<br>');
}

    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service worker non enregistré', e));
  });
}
</script>
